<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم - إدارة الجملة</title>
  <style>
    body { font-family: Tahoma, Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #222; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 14px 20px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,.06); margin-bottom: 20px; }
    .btn { background: #1d6feb; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; text-decoration: none; font-size: 14px; display: inline-block; }
    .btn-warn { background: #f59e0b; color: #fff; }
    .btn-danger { background: #dc2626; color: #fff; padding: 6px 10px; font-size: 12px; }
    .box { background: #fff; padding: 18px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,.06); margin-bottom: 20px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    input, select, textarea { padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
    .store-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px; border-bottom: 1px solid #eee; }
    .store-item img { width: 54px; height: 54px; object-fit: cover; border-radius: 8px; background: #eee; }
    .msg { margin-top: 10px; font-size: 13px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="top-bar">
    <h2>لوحة التحكم - إدارة الجملة</h2>
    <div class="row">
      <a class="btn" href="/">عرض الموقع للزبائن</a>
      <button class="btn btn-warn" type="button" onclick="loadAll()">طلبيات</button>
    </div>
  </div>

  <div class="box">
    <h3>إضافة متجر جديد</h3>
    <form id="storeForm" class="row" enctype="multipart/form-data">
      <input type="text" id="storeName" name="name" placeholder="اسم المتجر (مثال: سوبرماركت)" required />
      <input type="text" id="storeDesc" name="description" placeholder="وصف مختصر (اختياري)" />
      <input type="file" id="storeImage" name="image" accept="image/*" />
      <button class="btn" type="submit">إضافة المتجر</button>
    </form>
    <div id="storeMsg" class="msg"></div>
  </div>

  <div class="box">
    <h3>المتاجر الحالية</h3>
    <div id="storesList">جاري التحميل...</div>
  </div>

  <div class="box">
    <h3>إضافة منتج جديد</h3>
    <form id="productForm" class="row" enctype="multipart/form-data">
      <select id="productStore" name="store_id" required></select>
      <input type="text" id="productName" name="name" placeholder="اسم المنتج" required />
      <input type="number" id="productPrice" name="price" placeholder="السعر" step="0.01" required />
      <input type="number" id="productCarton" name="carton_qty" placeholder="كمية الكرتون" min="1" value="1" />
      <input type="number" id="productStock" name="stock" placeholder="المخزون" min="0" value="10" />
      <input type="file" id="productImage" name="image" accept="image/*" />
      <button class="btn" type="submit">إضافة المنتج</button>
    </form>
    <div id="productMsg" class="msg"></div>
  </div>

  <div class="box">
    <h3>المنتجات الحالية</h3>
    <div id="productsList">جاري التحميل...</div>
  </div>

  <script>
    async function loadStores() {
      const res = await fetch('/api/stores');
      const stores = await res.json();
      const list = document.getElementById('storesList');
      const sel = document.getElementById('productStore');

      if (!Array.isArray(stores) || stores.length === 0) {
        list.innerHTML = '<p>لا توجد متاجر بعد.</p>';
        sel.innerHTML = '<option value="">اختر متجراً أولاً</option>';
        return;
      }

      sel.innerHTML = stores.map(s => <option value="${s.id}">${s.name}</option>).join('');
      list.innerHTML = stores.map(s => `
        <div class="store-item">
          <div class="row">
            ${s.image ? <img src="${s.image}" alt="${s.name}" /> : ''}
            <div>
              <strong>${s.name}</strong>
              <div style="font-size:12px;color:#666;">${s.description || ''}</div>
            </div>
          </div>
          <button class="btn btn-danger" type="button" onclick="deleteStore(${s.id})">حذف</button>
        </div>
      `).join('');
    }

    async function loadProducts() {
      const res = await fetch('/api/products');
      const products = await res.json();
      const list = document.getElementById('productsList');
      if (!Array.isArray(products) || products.length === 0) {
        list.innerHTML = '<p>لا توجد منتجات بعد.</p>';
        return;
      }
      list.innerHTML = products.map(p => `
        <div class="store-item">
          <div class="row">
            ${p.image ? <img src="${p.image}" alt="${p.name}" /> : ''}
            <div>
              <strong>${p.name}</strong>
              <div style="font-size:12px;color:#666;">السعر: ${p.price} | كرتون: ${p.carton_qty} | مخزون: ${p.stock}</div>
            </div>
          </div>
          <button class="btn btn-danger" type="button" onclick="deleteProduct(${p.id})">حذف</button>
        </div>
      `).join('');
    }

    async function deleteStore(id) {
      await fetch('/api/stores/' + id, { method: 'DELETE' });
      await loadStores();
      await loadProducts();
    }

    async function deleteProduct(id) {
      await fetch('/api/products/' + id, { method: 'DELETE' });
      await loadProducts();
    }

    document.getElementById('storeForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const msg = document.getElementById('storeMsg');
      msg.style.color = '#1d6feb';
      msg.textContent = 'جاري حفظ المتجر...';

      const fd = new FormData(this);
      const res = await fetch('/api/stores', { method: 'POST', body: fd });
      const data = await res.json();

      if (!res.ok) {
        msg.style.color = '#dc2626';
        msg.textContent = data.error || 'فشل إضافة المتجر';
        return;
      }

      msg.style.color = '#16a34a';
      msg.textContent = 'تمت إضافة المتجر بنجاح!';
      this.reset();
      await loadStores();
    });

    document.getElementById('productForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const msg = document.getElementById('productMsg');
      msg.style.color = '#1d6feb';
      msg.textContent = 'جاري حفظ المنتج...';

      const fd = new FormData(this);
      const res = await fetch('/api/products', { method: 'POST', body: fd });
      const data = await res.json();

      if (!res.ok) {
        msg.style.color = '#dc2626';
        msg.textContent = data.error || 'فشل إضافة المنتج';
        return;
      }

      msg.style.color = '#16a34a';
      msg.textContent = 'تمت إضافة المنتج بنجاح!';
      this.reset();
      await loadProducts();
    });

    async function loadAll() {
      await loadStores();
      await loadProducts();
    }

    loadAll();
  </script>
</body>
</html>
