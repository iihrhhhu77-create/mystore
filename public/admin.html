<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم - إدارة الجملة</title>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
    body { margin: 0; background: #f1f5f9; color: #0f172a; }
    header {
      background: #0f172a; color: #fff; padding: 14px 20px;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    }
    .header-actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
    .btn {
      border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer;
      font-weight: bold; font-size: 13px; text-decoration: none; display: inline-block;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-success { background: #16a34a; color: #fff; }
    .btn-warning { background: #f59e0b; color: #fff; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-info { background: #0284c7; color: #fff; }
    .btn-dark { background: #334155; color: #fff; }
    .container { max-width: 1150px; margin: 20px auto; padding: 0 15px; }
    .card {
      background: #fff; border-radius: 12px; padding: 18px; margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .card h2 { margin-top: 0; font-size: 18px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 12px; }
    input, select, textarea {
      width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px;
    }
    .store-row, .product-row, .order-card, .custom-card {
      border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; margin-bottom: 10px;
      background: #f8fafc;
    }
    .store-row {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    }
    .row-left { display: flex; align-items: center; gap: 12px; }
    .row-left img { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; background: #e2e8f0; }
    .row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .order-items { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
    .order-item-chip {
      display: flex; align-items: center; gap: 8px; background: #fff;
      border: 1px solid #cbd5e1; border-radius: 8px; padding: 6px 10px;
    }
    .order-item-chip img { width: 42px; height: 42px; border-radius: 6px; object-fit: cover; }

    /* نافذة إدارة منتجات المتجر */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15,23,42,0.6);
      display: none; align-items: center; justify-content: center; z-index: 1000; padding: 15px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fff; width: 100%; max-width: 760px; border-radius: 14px;
      padding: 20px; max-height: 90vh; overflow-y: auto;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <div><strong>لوحة التحكم - إدارة الجملة</strong></div>
    <div class="header-actions">
      <a href="/" target="_blank" class="btn btn-primary">عرض الموقع للزبائن</a>
      <button type="button" class="btn btn-warning" onclick="goToOrders()">طلبيات</button>
    </div>
  </header>

  <div class="container">
    <!-- إضافة متجر جديد -->
    <div class="card">
      <h2>إضافة متجر جديد (سوبرات، غيار سيارات، حلويات...)</h2>
      <form id="addStoreForm" enctype="multipart/form-data">
        <div class="form-grid">
          <input type="text" name="name" placeholder="اسم المتجر (مثال: سوبرات)" required />
          <input type="text" name="description" placeholder="وصف قصير" />
          <input type="number" name="min_order" placeholder="أقل طلبية (د.ج)" />
          <input type="file" name="image" accept="image/*" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; padding:10px;">إضافة المتجر</button>
      </form>
    </div>

    <!-- المتاجر الحالية -->
    <div class="card">
      <h2>المتاجر الحالية (تعديل الاسم أو الصورة أو إدارة المنتجات)</h2>
      <div id="storesList"></div>
    </div>

    <!-- إضافة منتج جديد -->
    <div class="card">
      <h2>إضافة منتج جديد</h2>
      <form id="addProductForm" enctype="multipart/form-data">
        <div class="form-grid">
          <select name="store_id" id="mainProductStoreSelect" required></select>
          <input type="text" name="name" placeholder="اسم المنتج" required />
          <input type="number" step="0.01" name="price" placeholder="السعر للوحدة" required />
          <input type="number" name="carton_qty" value="1" min="1" placeholder="عدد القطع في الكرتون" />
          <input type="number" name="stock" value="0" min="0" placeholder="المخزون" />
          <input type="file" name="image" accept="image/*" />
        </div>
        <button type="submit" class="btn btn-success" style="width:100%; padding:10px;">حفظ المنتج</button>
      </form>
    </div>

    <!-- الطلبيات الواردة من أصحاب المحلات -->
    <div class="card" id="ordersSection">
      <h2>الطلبيات الواردة من أصحاب المحلات</h2>
      <div id="ordersList"></div>
    </div>

    <!-- طلبات منتجات غير متوفرة -->
    <div class="card">
      <h2>طلبات منتجات غير متوفرة (مع صور التوضيح)</h2>
      <div id="customRequestsList"></div>
    </div>
  </div>

  <!-- نافذة تعديل/إضافة/مسح منتجات متجر محدد -->
  <div id="storeProductsModal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalStoreTitle" style="margin:0;">منتجات المتجر</h3>
        <button class="close-btn" onclick="closeStoreProductsModal()">×</button>
      </div>

      <form id="modalProductForm" enctype="multipart/form-data" style="margin-bottom:16px; background:#f8fafc; padding:12px; border-radius:10px;">
        <input type="hidden" name="product_id" id="modalProductId" />
        <input type="hidden" name="store_id" id="modalStoreId" />
        <div class="form-grid">
          <input type="text" name="name" id="modalProductName" placeholder="اسم المنتج" required />
          <input type="number" step="0.01" name="price" id="modalProductPrice" placeholder="السعر للوحدة" required />
          <input type="number" name="carton_qty" id="modalProductCarton" value="1" min="1" placeholder="الكرتون" />
          <input type="number" name="stock" id="modalProductStock" value="0" min="0" placeholder="المخزون" />
          <input type="file" name="image" id="modalProductImage" accept="image/*" />
        </div>
        <div class="row-actions">
          <button type="submit" class="btn btn-success" id="modalSaveProductBtn">إضافة منتج للمتجر</button>
          <button type="button" class="btn btn-dark" onclick="resetModalProductForm()">تفريغ الحقول</button>
        </div>
      </form>

      <div id="modalProductsList"></div>
    </div>
  </div>

  <script>
    let storesCache = [];
    let currentModalStoreId = null;

    function goToOrders() {
      loadOrders();
      document.getElementById('ordersSection').scrollIntoView({ behavior: 'smooth' });
    }

    async function loadStores() {
      const res = await fetch('/api/stores');
      storesCache = await res.json();

      const select = document.getElementById('mainProductStoreSelect');
      select.innerHTML = storesCache.map((s) => <option value="${s.id}">${s.name}</option>).join('');

      const list = document.getElementById('storesList');
      if (!storesCache.length) {
        list.innerHTML = '<p style="color:#64748b;">لا توجد متاجر بعد.</p>';
        return;
      }

      list.innerHTML = storesCache.map((s) => `
        <div class="store-row">
          <div class="row-left">
            <img src="${s.image || 'https://via.placeholder.com/52'}" alt="${s.name}" />
            <div>
              <strong>${s.name}</strong>
              <div style="font-size:12px;color:#64748b;">${s.description || ''} ${s.min_order ? '• أقل طلبية: ' + s.min_order + ' د.ج' : ''}</div>
            </div>
          </div>
          <div class="row-actions">
            <button type="button" class="btn btn-info" onclick="openStoreProductsModal(${s.id}, '${escapeHtml(s.name)}')">منتجات المتجر</button>
            <button type="button" class="btn btn-warning" onclick="editStore(${s.id}, '${escapeHtml(s.name)}', '${escapeHtml(s.description || '')}')">تعديل</button>
            <button type="button" class="btn btn-danger" onclick="deleteStore(${s.id})">حذف</button>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      return String(str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    document.getElementById('addStoreForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const res = await fetch('/api/stores', { method: 'POST', body: formData });
      const data = await res.json();
      if (!res.ok) {
        alert(data.error || 'حدث خطأ أثناء الإضافة');
        return;
      }
      e.target.reset();
      await loadStores();
      alert('تمت إضافة المتجر بنجاح');
    });

    async function editStore(id, oldName, oldDesc) {
      const name = prompt('الاسم الجديد للمتجر:', oldName);
      if (!name || !name.trim()) return;
      const description = prompt('الوصف الجديد:', oldDesc);
      const res = await fetch('/api/stores/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name.trim(), description: description !== null ? description : oldDesc })
      });
      if (res.ok) {
        await loadStores();
        alert('تم تعديل المتجر');
      } else {
        const err = await res.json();
        alert(err.error || 'فشل التعديل');
      }
    }

    async function deleteStore(id) {
      if (!confirm('هل أنت متأكد من حذف هذا المتجر؟')) return;
      const res = await fetch('/api/stores/' + id, { method: 'DELETE' });
      const data = await res.json();
      if (res.ok && data.deleted) {
        await loadStores();
        alert('تم حذف المتجر بنجاح');
      } else {
        alert(data.error || 'تعذر حذف المتجر');
      }
    }

    document.getElementById('addProductForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const res = await fetch('/api/products', { method: 'POST', body: formData });
      const data = await res.json();
      if (!res.ok) {
        alert(data.error || 'حدث خطأ أثناء حفظ المنتج');
        return;
      }
      e.target.reset();
      await loadStores();
      alert('تم حفظ المنتج بنجاح');
    });

    // ================= إدارة منتجات المتجر في نافذة منبثقة =================
    async function openStoreProductsModal(storeId, storeName) {
      currentModalStoreId = storeId;
      document.getElementById('modalStoreId').value = storeId;
      document.getElementById('modalStoreTitle').textContent = 'إدارة منتجات متجر: ' + storeName;
      resetModalProductForm();
      document.getElementById('storeProductsModal').classList.add('open');
      await loadModalProducts(storeId);
    }

    function closeStoreProductsModal() {
      document.getElementById('storeProductsModal').classList.remove('open');
    }

    function resetModalProductForm() {
      document.getElementById('modalProductId').value = '';
      document.getElementById('modalStoreId').value = currentModalStoreId || '';
      document.getElementById('modalProductName').value = '';
      document.getElementById('modalProductPrice').value = '';
      document.getElementById('modalProductCarton').value = '1';
      document.getElementById('modalProductStock').value = '0';
      document.getElementById('modalProductImage').value = '';
      document.getElementById('modalSaveProductBtn').textContent = 'إضافة منتج للمتجر';
    }

    async function loadModalProducts(storeId) {
      const res = await fetch('/api/products?store_id=' + storeId);
      const products = await res.json();
      const list = document.getElementById('modalProductsList');

      if (!products.length) {
        list.innerHTML = '<p style="color:#64748b;">لا توجد منتجات في هذا المتجر بعد.</p>';
        return;
      }

      list.innerHTML = products.map((p) => `
        <div class="product-row store-row">
          <div class="row-left">
            <img src="${p.image || 'https://via.placeholder.com/52'}" alt="${p.name}" />
            <div>
              <strong>${p.name}</strong>
              <div style="font-size:12px;color:#475569;">السعر: ${p.price} د.ج • الكرتون: ${p.carton_qty || 1} • المخزون: ${p.stock || 0}</div>
            </div>
          </div>
          <div class="row-actions">
            <button type="button" class="btn btn-warning" onclick='startEditModalProduct(${JSON.stringify(p)})'>تعديل</button>
            <button type="button" class="btn btn-danger" onclick="deleteProduct(${p.id})">مسح</button>
          </div>
        </div>
      `).join('');
    }

    function startEditModalProduct(prod) {
      document.getElementById('modalProductId').value = prod.id;
      document.getElementById('modalStoreId').value = prod.store_id;
      document.getElementById('modalProductName').value = prod.name;
      document.getElementById('modalProductPrice').value = prod.price;
      document.getElementById('modalProductCarton').value = prod.carton_qty || 1;
      document.getElementById('modalProductStock').value = prod.stock || 0;
      document.getElementById('modalSaveProductBtn').textContent = 'حفظ تعديل المنتج';
    }

    document.getElementById('modalProductForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const prodId = document.getElementById('modalProductId').value;
      const formData = new FormData(e.target);
      formData.set('store_id', currentModalStoreId);

      const url = prodId ? '/api/products/' + prodId : '/api/products';
      const method = prodId ? 'PUT' : 'POST';

      const res = await fetch(url, { method, body: formData });
      const data = await res.json();
      if (!res.ok) {
        alert(data.error || 'حدث خطأ أثناء حفظ المنتج');
        return;
      }
      resetModalProductForm();
      await loadModalProducts(currentModalStoreId);
      alert(prodId ? 'تم تعديل المنتج' : 'تمت إضافة المنتج');
    });

    async function deleteProduct(id) {
      if (!confirm('هل تريد مسح هذا المنتج؟')) return;
      const res = await fetch('/api/products/' + id, { method: 'DELETE' });
      if (res.ok) {
        await loadModalProducts(currentModalStoreId);
        alert('تم مسح المنتج');
      }
    }

    // ================= الطلبيات مع الصور وتأكيد الطلبية =================
    async function loadOrders() {
      const res = await fetch('/api/orders?status=pending');
      const orders = await res.json();
      const list = document.getElementById('ordersList');

      if (!orders.length) {
        list.innerHTML = '<p style="color:#64748b;">لا توجد طلبيات معلقة حالياً.</p>';
        return;
      }

      list.innerHTML = orders.map((o) => {
        let items = [];
        try {
          items = typeof o.items_json === 'string' ? JSON.parse(o.items_json) : (o.items_json || []);
        } catch (e) {
          items = [];
        }

        const locText = o.location || o.wilaya || 'غير محدد';
        const itemsHtml = items.map((it) => `
          <div class="order-item-chip">
            <img src="${it.image || 'https://via.placeholder.com/42'}" alt="${it.name || ''}" />
            <div>
              <div><strong>${it.name || 'منتج'}</strong></div>
              <div style="font-size:12px;color:#475569;">الكمية: ${it.qty || 1} × ${it.price || 0} د.ج</div>
            </div>
          </div>
        `).join('');

        return `
          <div class="order-card" id="order-card-${o.id}">
            <div><strong>طلب #${o.id} - ${o.customer_name}</strong> (${o.phone})</div>
            <div style="font-size:13px; color:#334155; margin-top:4px;">الموقع: ${locText}</div>
            <div class="order-items">${itemsHtml}</div>
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-top:8px;">
              <strong>المجموع: ${o.total} د.ج</strong>
              <button type="button" class="btn btn-success" onclick="confirmOrder(${o.id})">تأكيد الطلبية</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function confirmOrder(id) {
      const res = await fetch('/api/orders/' + id + '/confirm', { method: 'PATCH' });
      if (res.ok) {
        const card = document.getElementById('order-card-' + id);
        if (card) card.remove();
        await loadOrders();
      } else {
        alert('حدث خطأ أثناء تأكيد الطلبية');
      }
    }

    // ================= طلبات المنتجات الخاصة =================
    async function loadCustomRequests() {
      const res = await fetch('/api/custom-requests');
      const reqs = await res.json();
      const list = document.getElementById('customRequestsList');

      if (!reqs.length) {
        list.innerHTML = '<p style="color:#64748b;">لا توجد طلبات منتجات خاصة بعد.</p>';
        return;
      }

      list.innerHTML = reqs.map((r) => `
        <div class="custom-card store-row">
          <div class="row-left">
            ${r.image ? <img src="${r.image}" alt="صورة الطلب" /> : ''}
            <div>
              <strong>${r.customer_name}</strong> (${r.phone})
              <div style="font-size:13px;color:#334155;margin-top:4px;">${r.notes || ''}</div>
            </div>
          </div>
          <button type="button" class="btn btn-danger" onclick="deleteCustomRequest(${r.id})">حذف</button>
        </div>
      `).join('');
    }

    async function deleteCustomRequest(id) {
      const res = await fetch('/api/custom-requests/' + id, { method: 'DELETE' });
      if (res.ok) {
        await loadCustomRequests();
      }
    }

    loadStores();
    loadOrders();
    loadCustomRequests();
  </script>
</body>
</html>
