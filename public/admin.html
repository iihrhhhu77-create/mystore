<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الجملة 24/7</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 pb-20">
    <div class="max-w-5xl mx-auto space-y-6">
        <div class="bg-slate-900 text-white p-4 rounded-2xl flex justify-between items-center">
            <h1 class="font-bold text-lg">لوحة التحكم - إدارة الجملة</h1>
            <a href="/" class="bg-blue-600 px-3 py-1.5 rounded-lg text-sm font-bold">عرض الموقع للزبائن</a>
        </div>

        <!-- إضافة متجر جديد -->
        <div class="bg-white p-5 rounded-2xl shadow-sm space-y-3">
            <h2 class="font-bold text-base">إضافة متجر جديد (سوبرات، غيار سيارات، حلويات...)</h2>
            <form id="addStoreForm" class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <input type="text" id="storeNameInput" name="name" required placeholder="اسم المتجر (مثال: سوبرات)" class="p-2.5 border rounded-lg text-sm">
                <input type="file" id="storeImageInput" name="image" accept="image/*" class="p-2 border rounded-lg text-xs">
                <button type="submit" class="bg-blue-600 text-white rounded-lg font-bold text-sm py-2.5">إضافة المتجر</button>
            </form>
        </div>

        <!-- قائمة المتاجر -->
        <div class="bg-white p-5 rounded-2xl shadow-sm space-y-3">
            <h2 class="font-bold text-base">المتاجر الحالية (تعديل الاسم أو الصورة مباشرة)</h2>
            <div id="storesList" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
        </div>

        <!-- إضافة منتج -->
        <div class="bg-white p-5 rounded-2xl shadow-sm space-y-3">
            <h2 class="font-bold text-base">إضافة منتج جديد</h2>
            <form id="addProductForm" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <select name="store_id" id="productStoreSelect" required class="p-2.5 border rounded-lg text-sm bg-white"></select>
                <input type="text" name="name" required placeholder="اسم المنتج" class="p-2.5 border rounded-lg text-sm">
                <input type="number" step="0.01" name="price" required placeholder="السعر للوحدة" class="p-2.5 border rounded-lg text-sm">
                <input type="file" name="image" accept="image/*" class="p-2 border rounded-lg text-xs">

                <div class="flex items-center gap-2 p-2.5 border rounded-lg bg-gray-50">
                    <input type="checkbox" id="isCartonCheck" name="is_carton" value="1" onchange="toggleStepInput()">
                    <label for="isCartonCheck" class="text-sm font-bold">يباع بالكرتون (مضاعفات)</label>
                </div>

                <input type="number" id="stepInput" name="step" min="1" value="1" disabled placeholder="عدد القطع في الكرتون (مثال: 5)" class="p-2.5 border rounded-lg text-sm disabled:bg-gray-100">

                <input type="text" name="fixed_note" placeholder="ملاحظة ثابتة للمنتج (مثال: أقل كمية هي 5 أكياس)" class="md:col-span-2 p-2.5 border rounded-lg text-sm">

                <button type="submit" class="md:col-span-2 bg-green-600 text-white py-2.5 rounded-lg font-bold text-sm">حفظ المنتج</button>
            </form>
        </div>

        <!-- الطلبيات -->
        <div class="bg-white p-5 rounded-2xl shadow-sm space-y-3">
            <h2 class="font-bold text-base">الطلبيات الواردة من أصحاب المحلات</h2>
            <div id="ordersList" class="space-y-2 text-sm"></div>
        </div>

        <!-- طلبات المنتجات الخاصة -->
        <div class="bg-white p-5 rounded-2xl shadow-sm space-y-3">
            <h2 class="font-bold text-base">طلبات منتجات غير متوفرة (مع صور التوضيح)</h2>
            <div id="customRequestsList" class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm"></div>
        </div>
    </div>

    <script>
        function toggleStepInput() {
            var checked = document.getElementById('isCartonCheck').checked;
            var stepInp = document.getElementById('stepInput');
            stepInp.disabled = !checked;
            if (!checked) stepInp.value = 1;
            else if (stepInp.value == 1) stepInp.value = 5;
        }

        function loadStores() {
            fetch('/api/stores')
                .then(function (res) { return res.json(); })
                .then(function (stores) {
                    var select = document.getElementById('productStoreSelect');
                    var selectHtml = '';
                    for (var i = 0; i < stores.length; i++) {
                        selectHtml += '<option value="' + stores[i].id + '">' + stores[i].name + '</option>';
                    }
                    select.innerHTML = selectHtml;

                    var list = document.getElementById('storesList');
                    if (!stores.length) {
                        list.innerHTML = '<p class="text-gray-400 text-sm">لا توجد متاجر بعد</p>';
                        return;
                    }
                    var html = '';
                    for (var j = 0; j < stores.length; j++) {
                        var s = stores[j];
                        var imgSrc = s.image ? s.image : 'https://placehold.co/80x80?text=Store';
                        html += '<div class="border p-3 rounded-xl flex items-center gap-3 bg-gray-50">';
                        html += '<img src="' + imgSrc + '" class="w-16 h-16 rounded-lg object-cover bg-white">';
                        html += '<div class="flex-1 space-y-1">';
                        html += '<input type="text" id="sname-' + s.id + '" value="' + s.name.replace(/"/g, '&quot;') + '" class="w-full p-1.5 border rounded text-sm bg-white">';
                        html += '<input type="file" id="simg-' + s.id + '" accept="image/*" class="text-xs w-full">';
                        html += '</div>';
                        html += '<div class="flex flex-col gap-1">';
                        html += '<button type="button" onclick="updateStore(' + s.id + ')" class="bg-amber-500 text-white px-2.5 py-1 rounded text-xs font-bold">تعديل</button>';
                        html += '<button type="button" onclick="deleteStore(' + s.id + ')" class="bg-red-600 text-white px-2.5 py-1 rounded text-xs font-bold">حذف</button>';
                        html += '</div>';
                        html += '</div>';
                    }
                    list.innerHTML = html;
                });
        }

        function updateStore(id) {
            var name = document.getElementById('sname-' + id).value;
            var file = document.getElementById('simg-' + id).files[0];
            var fd = new FormData();
            fd.append('name', name);
            if (file) fd.append('image', file);

            fetch('/api/stores/' + id, { method: 'PUT', body: fd })
                .then(function () {
                    alert('تم تعديل المتجر بنجاح');
                    loadStores();
                });
        }

        function deleteStore(id) {
            if (!confirm('هل أنت متأكد من حذف هذا المتجر؟')) return;
            fetch('/api/stores/' + id, { method: 'DELETE' })
                .then(function () {
                    loadStores();
                });
        }

        document.getElementById('addStoreForm').addEventListener('submit', function (e) {
            e.preventDefault();
            var nameVal = document.getElementById('storeNameInput').value;
            var fileVal = document.getElementById('storeImageInput').files[0];
            var fd = new FormData();
            fd.append('name', nameVal);
            if (fileVal) fd.append('image', fileVal);

            fetch('/api/stores', { method: 'POST', body: fd })
                .then(function (res) { return res.json(); })
                .then(function () {
                    document.getElementById('addStoreForm').reset();
                    alert('تمت إضافة المتجر بنجاح');
                    loadStores();
                })
                .catch(function (err) {
                    alert('حدث خطأ أثناء الإضافة: ' + err.message);
                });
        });

        document.getElementById('addProductForm').addEventListener('submit', function (e) {
            e.preventDefault();
            var fd = new FormData(e.target);
            if (!document.getElementById('isCartonCheck').checked) {
                fd.set('is_carton', '0');
                fd.set('step', '1');
            }
            fetch('/api/products', { method: 'POST', body: fd })
                .then(function (res) { return res.json(); })
                .then(function () {
                    e.target.reset();
                    toggleStepInput();
                    alert('تمت إضافة المنتج بنجاح');
                });
        });

        function loadOrders() {
            fetch('/api/orders')
                .then(function (res) { return res.json(); })
                .then(function (orders) {
                    var el = document.getElementById('ordersList');
                    if (!orders.length) {
                        el.innerHTML = '<p class="text-gray-400">لا توجد طلبيات بعد</p>';
                        return;
                    }
                    var html = '';
                    for (var i = 0; i < orders.length; i++) {
                        var o = orders[i];
                        var items = [];
                        try { items = JSON.parse(o.items_json || '[]'); } catch (e) {}
                        html += '<div class="border p-3 rounded-xl bg-gray-50">';
                        html += '<div class="flex justify-between font-bold"><span>طلب #' + o.id + ' - ' + o.customer_name + ' (' + o.phone + ')</span><span class="text-blue-700">' + o.total + '</span></div>';
                        html += '<p class="text-xs text-gray-600 mt-1">الموقع: ' + o.location + '</p>';
                        html += '<ul class="list-disc pr-5 mt-2 text-xs space-y-1">';
                        for (var k = 0; k < items.length; k++) {
                            html += '<li>' + items[k].name + ' — الكمية: <b>' + items[k].qty + '</b> × ' + items[k].price + '</li>';
                        }
                        html += '</ul></div>';
                    }
                    el.innerHTML = html;
                });
        }

        function loadCustomRequests() {
            fetch('/api/custom-requests')
                .then(function (res) { return res.json(); })
                .then(function (reqs) {
                    var el = document.getElementById('customRequestsList');
                    if (!reqs.length) {
                        el.innerHTML = '<p class="text-gray-400">لا توجد طلبات منتجات خاصة بعد</p>';
                        return;
                    }
                    var html = '';
                    for (var i = 0; i < reqs.length; i++) {
                        var r = reqs[i];
                        html += '<div class="border p-3 rounded-xl bg-gray-50 flex gap-3">';
                        if (r.image) {
                            html += '<img src="' + r.image + '" class="w-20 h-20 rounded-lg object-cover bg-white">';
                        }
                        html += '<div><p class="font-bold text-gray-800">' + r.description + '</p><p class="text-xs text-gray-400 mt-1">' + r.created_at + '</p></div></div>';
                    }
                    el.innerHTML = html;
                });
        }

        loadStores();
        loadOrders();
        loadCustomRequests();
    </script>
</body>
</html>
